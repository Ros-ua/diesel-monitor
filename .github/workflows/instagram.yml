name: Пост в Instagram (будні)

on:
  schedule:
    # 13:00 UTC = 16:00 за Києвом, пн–пт — час найбільшого охоплення в ніші
    # (ціни Мінфін оновлює ~14:00, тож дані вже свіжі)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Instagram САМ качає картинку за URL, тож спершу кладемо файл у репозиторій
      - name: Картка дня
        run: node scripts/instagram-post.mjs --card
      - name: Коміт картки
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/cards
          if ! git diff --cached --quiet; then
            git commit -m "ig: картка $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Публікація
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node scripts/instagram-post.mjs

      - name: Коміт стану посту
        if: always()
        run: |
          git add public/data/ig-post.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: стан ig-посту $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
