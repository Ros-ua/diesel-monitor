name: Пост в Instagram (будні)

# Пост виходить ОДРАЗУ ПІСЛЯ збору цін, а не за власним розкладом.
# Причина: GitHub затримує cron на 1–2 години (збір призначений на 12:10 UTC,
# фактично йде ~13:51). За фіксованим розкладом о 13:00 пост виходив би
# РАНІШЕ за дані й брав учорашні ціни.
# Захист від повторів — у самому скрипті: за одну дату постимо лише раз,
# тож другий збір (18:10) другого посту не зробить.

on:
  workflow_run:
    workflows: ['Збір цін (щодня)']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: 'Репетиція: перевірити шлях публікації, але не постити'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # тільки після успішного збору; вихідні пропускаємо — Мінфін їх не оновлює
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run стартує на комміті ДО збору — беремо явно свіжий main,
      # інакше картка згенерується зі старих цін
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Instagram САМ качає картинки за URL, тож спершу кладемо файли в репозиторій.
      # З 11.08.2026 денний пост — карусель із 5 слайдів замість однієї картки:
      # гортання тримає людину в пості довше, а час перегляду — головний сигнал
      # для алгоритму. Одиночна картка лишається у price-card.mjs для Telegram.
      - name: Слайди каруселі
        run: node scripts/instagram-carousel.mjs --cards
      - name: Коміт слайдів
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/cards public/data/ig-carousel-pick.json
          if ! git diff --cached --quiet; then
            git commit -m "ig: слайди каруселі $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Публікація
        if: ${{ !inputs.dry }}
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node scripts/instagram-carousel.mjs

      - name: Коміт стану посту
        if: always()
        run: |
          git add public/data/ig-carousel.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: стан каруселі $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
