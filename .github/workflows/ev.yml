name: Зарядки EV (щотижня)

on:
  schedule:
    # щопонеділка о 03:20 UTC — локації змінюються повільно
    - cron: '20 3 * * 1'
  workflow_dispatch:

# ⚠️ Права — по задачах (звіт безпеки 28.09, п.3): збір запускає npm ci і тримає
# токени, тож Pages йому не потрібні; pages/id-token — лише задачі deploy.
permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  ev:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # збір сам пушить оновлені дані
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Збір зарядних станцій (OpenStreetMap)
        run: node scripts/ev-collect.mjs
      - name: Коміт оновлених станцій
        id: commit
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/ev-stations.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Станції без змін"
          else
            git commit -m "data: автооновлення зарядних станцій $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: ev
    if: needs.ev.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: git pull --ff-only
      - run: npm ci
      - name: Свіжа SEO-мета
        run: node scripts/seo.mjs
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
