name: Збір цін (щодня)

on:
  schedule:
    # Мінфін оновлює ціни ~опівдні за Києвом (11:00–12:00 UTC).
    # 12:10 UTC — основний збір одразу після оновлення,
    # 18:10 UTC — контрольний (пізні правки або збій першого запуску).
    - cron: '10 12,18 * * *'
  workflow_dispatch:

# ⚠️ Права — по задачах (звіт безпеки 28.09, п.3): збір запускає npm ci і тримає
# токени, тож Pages йому не потрібні; pages/id-token — лише задачі deploy.
permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # збір сам пушить оновлені дані
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # sharp потрібен для картки цін у Telegram-пості
      - run: npm ci
      - name: Збір даних
        run: node scripts/collect.mjs
      # Дані комітимо ПЕРШИМИ: збій постингу не має блокувати оновлення сайту
      - name: Коміт оновлених даних
        id: commit
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Дані без змін"
          else
            # ⚠️ Деплой — лише коли змінилось щось ЗНАЧУЩЕ. Раніше тут стояло
            # changed=true беззастережно, а в кожному файлі є позначка часу,
            # яка міняється в КОЖНОМУ прогоні: history.updated, factors.updated,
            # latest.collectedAt, новий запис у журналі. Через це сайт
            # перезбирався двічі на добу навіть тоді, коли жодна ціна не
            # зрушила. Порівнюємо ДО коміту, бо скрипт дивиться на HEAD.
            if node scripts/змінилось.mjs; then meaningful=true; else meaningful=false; fi
            git commit -m "data: автооновлення цін $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo "changed=$meaningful" >> "$GITHUB_OUTPUT"
          fi
      - name: Пост у Telegram-канал
        continue-on-error: true # падіння посту не валить збір цін
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: node scripts/telegram-post.mjs
      - name: Коміт стану посту
        continue-on-error: true
        run: |
          git add public/data/tg-post.json public/data/tg-news-posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: стан tg-посту $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase --autostash origin main || true
            git push
          fi

  # Пуш від GITHUB_TOKEN не запускає deploy.yml, тому деплоїмо тут само
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Свіжа SEO-мета (ціна дня в description)
        run: node scripts/seo.mjs
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
