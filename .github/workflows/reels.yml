name: Reels в Instagram (за подією)

# Вертикальне відео з анімованим графіком ціни. Виходить НЕ за розкладом, а
# коли є інфопривід: ціна зрушила ≥1% за тиждень і від попереднього ролика
# минуло ≥3 дні (див. scripts/reel-check.mjs). У спокійний тиждень графік —
# майже пряма лінія, такий ролик не додивляються, а Instagram за недодивлені
# Reels ріже охоплення наступним.
#
# Музика — CC0 з Openverse (комерція дозволена, атрибуція не потрібна).
# Трендові звуки Instagram через API недоступні нікому — обмеження Meta.

on:
  schedule:
    # перевірка щодня о 08:30 за Києвом; ролик — лише коли умови збіглись
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      fuel:
        description: 'Пальне (порожньо = обрати за найбільшим рухом ціни)'
        type: string
        default: ''
      days:
        description: 'Скільки точок історії брати (порожньо = 30)'
        type: string
        default: ''
      force:
        description: 'Зняти ролик навіть без руху ціни'
        type: boolean
        default: false
      dry:
        description: 'Тільки зібрати відео, не публікувати'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Спершу вирішуємо, чи є взагалі інфопривід. Якщо ні — виходимо ще до
      # встановлення ffmpeg і npm ci, щоб не палити хвилини даремно.
      - name: Чи є привід для ролика
        id: check
        run: node scripts/reel-check.mjs

      - run: npm ci
        if: steps.check.outputs.run == 'true' || inputs.force

      # на ubuntu-24.04 ffmpeg уже не передвстановлений
      - name: Встановити ffmpeg
        if: steps.check.outputs.run == 'true' || inputs.force
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Кадри
        if: steps.check.outputs.run == 'true' || inputs.force
        run: |
          node scripts/reel-frames.mjs \
            "${{ inputs.fuel || steps.check.outputs.fuel || 'dp' }}" \
            "${{ inputs.days || steps.check.outputs.days || 30 }}"

      # музика не критична: якщо не знайшлась (код 3) — збираємо без звуку
      - name: Музика (CC0)
        id: music
        if: steps.check.outputs.run == 'true' || inputs.force
        continue-on-error: true
        run: node scripts/reel-music.mjs 12

      # Кадри тепер прозорі — фон під них підкладає reel-compose.mjs: відео з
      # assets/reel-bg (чергується по тижнях) або суцільний колір, якщо кліпів нема.
      - name: Збірка відео
        if: steps.check.outputs.run == 'true' || inputs.force
        run: |
          mkdir -p public/reels
          node scripts/reel-compose.mjs
          ls -lh public/reels

      # тримаємо лише 3 останні ролики — відео важке
      - name: Прибрати старі ролики
        if: steps.check.outputs.run == 'true' || inputs.force
        run: |
          cd public/reels
          ls -1t *.mp4 2>/dev/null | tail -n +4 | xargs -r rm --

      - name: Коміт відео
        if: steps.check.outputs.run == 'true' || inputs.force
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/reels
          if ! git diff --cached --quiet; then
            git commit -m "reel: відео $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Публікація
        if: (steps.check.outputs.run == 'true' || inputs.force) && !inputs.dry
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node scripts/instagram-reel.mjs

      - name: Коміт стану
        if: always()
        run: |
          git add public/data/ig-reel.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: стан Reels $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
