name: Зведення Instagram (щотижня)

on:
  schedule:
    # понеділок 06:00 UTC = 09:00 за Києвом — підсумок минулого тижня
    - cron: '0 6 * * 1'
  workflow_dispatch:

# лише читання коду; писати в репо не треба (звіт безпеки 28.09, п.4)
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Зведення у Telegram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_OWNER_CHAT: ${{ vars.TG_OWNER_CHAT }}
        run: node scripts/ig-insights.mjs
