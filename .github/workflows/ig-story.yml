name: Сторіс із цінами (за свіжими даними)

# Сторіс виходить ОДРАЗУ ПІСЛЯ збору цін, а не вранці за розкладом.
# Причина: Мінфін оновлює ціни ~14:00, тож ранкова сторіс показувала б
# учорашні числа — на сайті вже сьогоднішні, а в сторіс учорашні.
# Скрипт додатково не публікує, якщо дата даних не змінилась (вихідні).

on:
  workflow_run:
    workflows: ['Збір цін (щодня)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    # лише після успішного збору (або ручного запуску)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run стартує на комміті ДО збору — беремо явно свіжий main
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # картинку Instagram качає сам за URL — спершу коміт, потім публікація
      - name: Картка сторіс
        run: node scripts/instagram-story.mjs --card
      - name: Коміт картки
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/cards public/data/ig-story-pick.json
          if ! git diff --cached --quiet; then
            git commit -m "story: картка $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Публікація
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: node scripts/instagram-story.mjs

      - name: Коміт стану
        if: always()
        run: |
          git add public/data/ig-story.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: стан сторіс $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
