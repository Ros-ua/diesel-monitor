name: Збір новин (кожні 3 години)

on:
  schedule:
    # кожні 3 години о :37 — непопулярна хвилина, GitHub менше запізнюється;
    # раніше кожні 2 години (звіт health 28.09: news — найбільше запусків)
    - cron: '37 */3 * * *'
  workflow_dispatch:

# ⚠️ Права — по задачах (звіт безпеки 28.09, п.3): збір запускає npm ci і тримає
# токени, тож Pages йому не потрібні; pages/id-token — лише задачі deploy.
permissions: {}

# та сама група, що й у збору цін — запуски не конфліктують за git push
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # збір сам пушить оновлені дані
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Збір новин
        run: node scripts/collect.mjs --news-only
      # Постинг у канал винесено в окремий tg-post.yml (кожні 2 години, по 1 новині)
      - name: Коміт оновлених новин
        id: commit
        run: |
          git config user.name "diesel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Новини без змін"
          else
            # ⚠️ Деплой — лише коли змінились самі новини, а не позначка
            # часу у файлі (див. scripts/змінилось.mjs). Перевіряємо ДО
            # коміту, бо скрипт порівнює робочу теку з HEAD.
            if node scripts/змінилось.mjs; then meaningful=true; else meaningful=false; fi
            git commit -m "data: автооновлення новин $(date -u +%Y-%m-%d_%H:%M)"
            # інший робочий процес міг запушити раніше — підтягуємо й пробуємо ще раз
            for i in 1 2 3; do
              git push && break
              echo "push відхилено (спроба $i) — підтягую зміни"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            echo "changed=$meaningful" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: news
    if: needs.news.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git pull --ff-only
      - run: npm ci
      - name: Свіжа SEO-мета (ціна дня в description)
        run: node scripts/seo.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
